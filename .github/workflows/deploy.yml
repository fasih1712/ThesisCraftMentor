name: Build and Deploy

# Keyless deploy: GitHub OIDC -> IAM role (no AWS keys or SSH key in this repo).
#   build : docker image -> Amazon ECR
#   deploy: AWS SSM Run Command on the EC2 -> pull from ECR (instance role), restart container
# Role trust is limited to Aftr-Solutions/ThesisCraftMentor on refs/heads/main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # 00:30 UTC = 05:30 Pakistan time; publishes any blog post dated today
    - cron: '30 0 * * *'

concurrency:
  group: deploy-thesiscraftmentors
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::545908811041:role/github-actions-thesiscraftmentors-deploy
  ECR_REPOSITORY: thesiscraftmentors
  INSTANCE_ID: i-0fe1dd19adfb072d6

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.due.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to deploy
        id: due
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif node scripts/build-blog.mjs --due | grep -q "due=true"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for AWS
      contents: read
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build-blog.mjs reads commit dates for sitemap lastmod

      - name: Build blog for today
        run: node scripts/build-blog.mjs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: thesiscraftmentors-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: img
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: thesiscraftmentors-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          REGISTRY="${IMAGE%%/*}"
          cat > script.sh <<EOF
          set -e
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}
          docker pull ${IMAGE}:${GITHUB_SHA}
          docker stop thesiscraftmentors || true
          docker rm thesiscraftmentors || true
          docker run -d \\
            --name thesiscraftmentors \\
            --restart unless-stopped \\
            -p 80:80 -p 443:443 \\
            -v caddy_data:/data \\
            -v caddy_config:/config \\
            ${IMAGE}:${GITHUB_SHA}
          # remove only this site's older images; other apps on the server are untouched
          docker images ${IMAGE} --format '{{.Repository}}:{{.Tag}}' | grep -v ":${GITHUB_SHA}\$" | xargs -r docker rmi || true
          docker image prune -f
          docker ps --filter name=thesiscraftmentors --format '{{.Names}} {{.Image}} {{.Status}}'
          EOF
          PARAMS=$(jq -n --rawfile s script.sh '{commands: [$s], executionTimeout: ["600"]}')
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "thesiscraftmentors ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"
          STATUS=Pending
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "::group::Server output"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          ERR=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text)
          [ -z "$ERR" ] || { echo "::group::Server errors"; echo "$ERR"; echo "::endgroup::"; }
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
