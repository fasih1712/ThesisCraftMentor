name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # 00:30 UTC = 05:30 Pakistan time; publishes any blog post dated today
    - cron: '30 0 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fasih1712/thesiscraftmentors

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.due.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to deploy
        id: due
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif node scripts/build-blog.mjs --due | grep -q "due=true"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build blog for today
        run: node scripts/build-blog.mjs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker stop thesiscraftmentors || true
            docker rm thesiscraftmentors || true
            docker run -d \
              --name thesiscraftmentors \
              --restart unless-stopped \
              -p 80:80 -p 443:443 \
              -v caddy_data:/data \
              -v caddy_config:/config \
              ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker image prune -f
