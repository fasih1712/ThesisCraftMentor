services:
  web:
    image: 545908811041.dkr.ecr.ap-south-1.amazonaws.com/thesiscraftmentors:latest
    container_name: thesiscraftmentors
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
