<script>
  (function(){
    try{
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    }catch(e){}
  })();
</script>
<style>
  :root{
    --navy-900:#0c2038;
    --navy-800:#123253;
    --gold-500:#d4af37;
    --gold-400:#e3c463;
    --gold-700:#9c7a1f;
    --paper:#f6f2e7;
    --paper-line:#e6ddc4;
    --ink:#1c1a15;
    --ink-soft:#4a463c;
    --bg:#f6f2e7;
    --surface:#ffffff;
    --heading:#0c2038;
    --navy-700:#1a4267;
    --white:#ffffff;
    --radius-s:4px;
    --maxw:1120px;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper-line:rgba(212,175,55,0.16);
      --ink:#f2ede2;
      --ink-soft:rgba(242,237,226,0.7);
      --gold-700:#e3c463;
      --bg:#0d1420;
      --surface:#16202f;
      --heading:#f6f2e7;
    }
  }
  :root[data-theme="dark"]{
    --paper-line:rgba(212,175,55,0.16);
    --ink:#f2ede2;
    --ink-soft:rgba(242,237,226,0.7);
    --gold-700:#e3c463;
    --bg:#0d1420;
    --surface:#16202f;
    --heading:#f6f2e7;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:1.05rem; line-height:1.75;}
  a{color:var(--gold-700);}
  img{max-width:100%; display:block;}
  /* nav */
  header.site-nav{
    position:sticky; top:0; z-index:50;
    background:rgba(12,32,56,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(212,175,55,0.25);
  }
  .nav-inner{
    max-width:var(--maxw); margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  .brand{display:flex; align-items:center; gap:10px; color:var(--paper);}
  .brand img{height:38px; width:38px; border-radius:50%; box-shadow:0 0 0 1px rgba(212,175,55,0.4);}
  .brand-name{font-family:'Fraunces',serif; font-size:1.05rem; color:var(--white); line-height:1.15;}
  .brand-name small{display:block; font-family:'Inter',sans-serif; font-size:0.62rem; letter-spacing:0.09em; color:var(--gold-400); font-weight:500;}
  nav.links{display:flex; gap:30px; align-items:center;}
  nav.links a{position:relative; color:var(--paper); font-size:0.92rem; opacity:0.85; transition:opacity .2s;}
  nav.links a::after{content:""; position:absolute; left:0; right:0; bottom:-6px; height:1px; background:var(--gold-400); transform:scaleX(0); transform-origin:left; transition:transform .25s var(--ease);}
  nav.links a:hover{opacity:1;}
  nav.links a:hover::after{transform:scaleX(1);}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:var(--radius-s);
    font-size:0.92rem; font-weight:600; cursor:pointer; border:1px solid transparent;
    transition:transform .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 14px 24px -12px rgba(0,0,0,0.35);}
  .btn-gold{background:var(--gold-500); color:var(--navy-900);}
  .btn-gold:hover{background:var(--gold-400);}
  .btn-ghost{background:transparent; border-color:rgba(246,242,231,0.4); color:var(--paper);}
  .btn-ghost:hover{border-color:var(--gold-400); color:var(--gold-400);}
  .nav-cta{display:none;}
  @media (min-width:860px){ .nav-cta{display:inline-flex;} }

  .menu-toggle{display:none; background:none; border:none; color:var(--paper); padding:6px; cursor:pointer;}
  .menu-toggle svg{width:24px; height:24px; display:block;}

  .theme-toggle{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(212,175,55,0.35); background:rgba(246,242,231,0.06);
    color:var(--gold-400); cursor:pointer;
    transition:background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
  }
  .theme-toggle:hover{background:rgba(212,175,55,0.18); border-color:var(--gold-400); transform:translateY(-2px);}
  .theme-toggle svg{width:18px; height:18px; display:none;}
  .theme-toggle .icon-sun{display:block;}
  :root[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  :root[data-theme="dark"] .theme-toggle .icon-moon{display:block;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .icon-sun{display:none;}
    :root:not([data-theme="light"]) .theme-toggle .icon-moon{display:block;}
  }
  @media (max-width:859px){
    nav.links{
      position:absolute; top:100%; left:0; right:0;
      flex-direction:column; align-items:stretch; gap:0;
      background:var(--navy-900); border-bottom:1px solid rgba(212,175,55,0.25);
      max-height:0; overflow:hidden;
      transition:max-height .3s var(--ease);
    }
    nav.links a{padding:16px 28px; border-top:1px solid rgba(212,175,55,0.14);}
    nav.links a::after{display:none;}
    header.site-nav.nav-open nav.links{max-height:320px;}
    .menu-toggle{display:block;}
  }

  .cta .btn{margin-top:4px;}

  footer{background:var(--navy-900); color:rgba(246,242,231,0.6); padding:38px 0;}
  footer a{color:inherit; text-decoration:none;}

  /* whatsapp float */
  .wa-float{
    position:fixed; bottom:24px; right:24px; z-index:60;
    width:58px; height:58px; border-radius:50%;
    background:#1d8b4a;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 24px -8px rgba(0,0,0,0.5);
    transition:transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .wa-float::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:#1d8b4a; opacity:0.55; z-index:-1; pointer-events:none;
    animation:wa-pulse 2.4s ease-out infinite;
  }
  @keyframes wa-pulse{
    0%{transform:scale(1); opacity:0.55;}
    100%{transform:scale(1.9); opacity:0;}
  }
  .wa-float:hover{transform:translateY(-3px) scale(1.04); box-shadow:0 16px 32px -10px rgba(0,0,0,0.55);}
  .wa-float svg{width:28px; height:28px; fill:var(--white);}

  @media (max-width:400px){ .wrap{padding:0 18px;} .nav-inner{padding:12px 18px; gap:12px;} .brand-name{font-size:0.92rem;} .brand img{height:32px; width:32px;} .wa-float{width:50px; height:50px; bottom:16px; right:16px;} .wa-float svg{width:24px; height:24px;} }
  article{max-width:720px; margin:0 auto; padding:56px 28px 72px;}
  .crumbs{font-size:0.85rem; color:var(--ink-soft); margin-bottom:18px;}
  .crumbs a{color:var(--ink-soft);}
  h1,h2,h3{font-family:'Fraunces',serif; color:var(--heading); line-height:1.2; font-weight:600;}
  h1{font-size:clamp(1.9rem,4.5vw,2.7rem); margin:0 0 14px;}
  h2{font-size:1.55rem; margin:2.4em 0 0.6em;}
  h3{font-size:1.2rem; margin:1.8em 0 0.4em;}
  .meta{color:var(--ink-soft); font-size:0.9rem; margin-bottom:32px;}
  .lede{font-size:1.15rem; color:var(--ink-soft);}
  ul,ol{padding-left:1.3em;}
  li{margin-bottom:0.5em;}
  .toc{background:var(--surface); border:1px solid var(--paper-line); border-radius:10px; padding:20px 24px; margin:32px 0;}
  .toc strong{font-family:'Fraunces',serif; color:var(--heading);}
  .toc ol{margin:10px 0 0;}
  .note{border-left:3px solid var(--gold-500); background:var(--surface); padding:14px 20px; border-radius:0 10px 10px 0; margin:24px 0;}
  table{width:100%; border-collapse:collapse; margin:20px 0; font-size:0.95rem;}
  th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--paper-line); vertical-align:top;}
  th{font-family:'Fraunces',serif; color:var(--heading);}
  .table-wrap{overflow-x:auto;}
  .cta{background:var(--navy-900); color:rgba(246,242,231,0.85); border-radius:16px; padding:32px; margin-top:56px;}
  .cta h2{color:var(--paper); margin-top:0;}
  .related{margin-top:40px; padding-top:24px; border-top:1px solid var(--paper-line);}
  .related strong{font-family:'Fraunces',serif; color:var(--heading);}
  /* blog index */
  .blog-index{max-width:var(--maxw); margin:0 auto; padding:56px 28px 80px;}
  .blog-index > p{color:var(--ink-soft); max-width:640px;}
  .post-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:22px; margin-top:36px;}
  .post-card{display:flex; flex-direction:column; gap:10px; padding:26px; background:var(--surface); border:1px solid var(--paper-line); border-radius:14px; text-decoration:none; color:var(--ink); transition:transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);}
  .post-card:hover{transform:translateY(-4px); border-color:var(--gold-500); box-shadow:0 18px 36px -24px rgba(0,0,0,0.4);}
  .post-card .tag{align-self:flex-start; font-size:0.72rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold-700);}
  .post-card h2{font-size:1.2rem; margin:0;}
  .post-card p{margin:0; font-size:0.95rem; color:var(--ink-soft); line-height:1.6;}
  .post-card .post-meta{margin-top:auto; font-size:0.82rem; color:var(--ink-soft);}
  .post-card .new{display:inline-block; margin-left:8px; padding:1px 8px; border-radius:999px; background:var(--gold-500); color:var(--navy-900); font-size:0.68rem; font-weight:600; letter-spacing:0.06em; vertical-align:middle;}
  @media (max-width:520px){
    .blog-index{padding:40px 16px 56px;}
    .post-list{grid-template-columns:1fr;}
    article{padding:40px 16px 56px;}
    .cta{padding:24px 20px;}
  }
</style>
</head>

<script>
  /* theme toggle: defaults to system preference, overridden and remembered once the user picks */
  (function(){
    var themeToggle = document.getElementById('themeToggle');
    var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');

    function currentTheme(){
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'light' || attr === 'dark') return attr;
      return (mql && mql.matches) ? 'dark' : 'light';
    }
    function reflect(theme){
      themeToggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    }
    reflect(currentTheme());

    themeToggle.addEventListener('click', function(){
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      reflect(next);
      try{ localStorage.setItem('theme', next); }catch(e){}
    });

    if (mql && mql.addEventListener) {
      mql.addEventListener('change', function(){
        if (!document.documentElement.getAttribute('data-theme')) reflect(currentTheme());
      });
    }
  })();

  var toggle = document.getElementById('menuToggle');
  var siteNav = document.querySelector('.site-nav');
  toggle.addEventListener('click', function(){
    var open = siteNav.classList.toggle('nav-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.querySelectorAll('#primaryNav a').forEach(function(link){
    link.addEventListener('click', function(){
      siteNav.classList.remove('nav-open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });
</script>
